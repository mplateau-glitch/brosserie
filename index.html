<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Brosserie — variantes d'une même inspiration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #f4efe4;
    background-image: radial-gradient(ellipse at center, #faf6ec 0%, #e9e2d0 100%);
    cursor: crosshair;
    font-family: 'Special Elite', 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; }
  .letter {
    position: absolute;
    color: #2b2620;
    text-shadow: 0 0 0.5px rgba(43,38,32,.4);
    will-change: transform, opacity;
    pointer-events: none;
    white-space: pre;
  }
  #hud {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center;
    font-size: 13px; letter-spacing: 1px;
    color: rgba(43,38,32,.55);
    pointer-events: none;
  }
  #badge {
    position: fixed; top: 18px; right: 22px;
    font-size: 14px; color: rgba(43,38,32,.6);
    pointer-events: none;
  }
  #paused {
    position: fixed; top: 18px; left: 22px;
    font-size: 14px; color: #8a2f22;
    opacity: 0; transition: opacity .3s;
    pointer-events: none;
  }
  #paused.on { opacity: 1; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="badge"></div>
<div id="paused">— FIGÉ —</div>
<div id="hud">bougez la souris : le souffle emporte les lettres &nbsp;·&nbsp; cliquez : une autre variante &nbsp;·&nbsp; espace : figer / relancer</div>

<script>
"use strict";

const TEXTES = [
`Temple de la caducité ! L'hiver, rongées de lichens, les basses branches sont déchues. Et point d'encombre à mi-hauteur, point de serpentements de lianes, ni de cordes. L'on évolue à l'aise entre ces mâts séniles dont les tignasses ne s'entremêlent qu'aux cieux.
En août, c'est, tout entourée de miroirs, une halle aux épingles à cheveux odoriférantes (soulevées parfois après quelque pluie par la curiosité maladive et prudente des champignons) – une brosserie aux longs manches ciselés, aux poils verts, pour la flamboyante créature qui sort de la baignoire marine ou lacustre fumante au bas-côté.`,
`Alpestre brosserie entourée de miroirs
Aux manches de bois pourpre haut touffus de poils verts
Dans ta pénombre chaude entachée de soleil
Vint se coiffer Vénus sortant de la baignoire
Ou marine ou lacustre au bas-côté fumante…
D'où l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes
… Flotte une oblique écharpe au tissu sans sommeil.`,
`L'alpestre brosserie – entourée de miroirs –
Aux manches de bois pourpre haut touffus de poils verts…
Sur l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes,
Dans la pénombre chaude entachée de soleil
Sèche aussitôt la nue sortant de la baignoire
Ou marine ou lacustre au bas-côté fumante
Sous ces rubans tendus au tissu sans sommeil.`,
`La haute brosserie entourée de miroirs
Aux manches de bois pourpre aux touffes de poils verts.
Dans son peignoir, pénombre entachée de soleil,
Sèche aussitôt Vénus sortant de la baignoire
Ou marine ou lacustre au bas-côté fumante
Sur l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de têtes négligentes…
Flotte l'écharpe oblique au tissu sans sommeil.`,
`L'alpestre brosserie haut touffue de poils verts
Aux manches de bois pourpre entourés de miroirs…
Dans sa pénombre chaude entachée de soleil
Vint se coiffer Vénus sortant de la baignoire
Ou marine ou lacustre au bas-côté fumante.
D'où l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes,
Et ces rubans tendus au tissu sans sommeil.`,
`La haute brosserie, entourée de miroirs,
Aux manches de bois pourpre haut touffus de poils verts…
Dans ces peignoirs faits d'ombre entachée de soleil,
Séchez, corps vaporeux issus de la baignoire
Ou marine ou lacustre au bas-côté fumante,
Sur l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes
Et parmi ces rubans au tissu sans sommeil.`,
`La haute brosserie entourée de miroirs
Aux manches de bois pourpre haut touffus de poils verts…
Dans un peignoir fait d'ombre entachée de soleil
Vénus vint s'y coiffer sortant de la baignoire
Ou marine ou lacustre au bas-côté fumante…
D'où l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes,
Et ces rubans tissus d'atomes sans sommeil.`,
`La haute brosserie haut touffue de poils verts
Aux manches ciselés entourés de miroirs…
Vénus s'y coiffa-t-elle issue de la baignoire
Ou marine ou lacustre au bas-côté fumante ?
Reste, sur l'épaisseur élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes,
Un peignoir de pénombre entachée de soleil,
Obliquement tissu d'atomes sans sommeil.`,
`L'antique brosserie, haut touffue de poils verts,
Aux manches ciselés entourés de miroirs…
Dans un peignoir fait d'ombre entachée de soleil,
Vénus s'y escamote, issue de la baignoire
Ou marine ou lacustre au bas-côté fumante.
Il ne reste, au tapis élastique et vermeil
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes,
Que des rubans tissus d'atomes sans sommeil.`,
`Toute une brosserie haut touffue de poils verts
Aux manches de bois pourpre entourés de miroirs
Escamote une forme issue de la baignoire
Ou marine ou lacustre au bas-côté fumante
Qui ne laisse au tapis élastique et vermeil
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes
Qu'un peignoir de pénombre entachée de soleil
Obliquement tissu d'atomes sans sommeil.`,
`L'alpestre brosserie haut touffue de poils verts
Aux manches de bois pourpre entourés de miroirs :
Vénus s'y coiffa-t-elle, issue de la baignoire
Ou marine ou lacustre au bas-côté fumante ?
— Il reste un peignoir d'ombre entachée de soleil
Sur l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes,
Et des rubans tissus d'atomes sans sommeil.`,
`L'alpestre brosserie haut touffue de poils verts
Aux manches de bois pourpre entourés de miroirs.
Du corps étincelant sorti de la baignoire
Ou marine ou lacustre au bas-côté fumante,
Sur l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes,
Il reste un peignoir d'ombre entachée de soleil
Obliquement tissu d'atomes sans sommeil.`,
`Dans cette brosserie haut touffue de poils verts
Aux manches de bois pourpre entourés de miroirs,
De vous, corps radieux issu de la baignoire
Ou marine ou lacustre au bas-côté fumante,
Il ne reste au tapis élastique et vermeil
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes,
Qu'un peignoir de pénombre entachée de soleil
Obliquement tissu d'atomes sans sommeil.`,
`L'alpestre brosserie aux touffes de poils verts,
Aux manches de bois pourpre entourés de miroirs
Que Phœbus s'y présente, issu de la baignoire
Ou marine ou lacustre au bas-côté fumante,
Il n'en reste – au tapis élastique et vermeil
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes –
Qu'un peignoir de pénombre entachée de soleil
Constamment traversé de mouches sans sommeil.`,
`Par cette brosserie aux touffes de poils verts,
Aux manches ciselés entourés de miroirs,
Du flamboiement divin issu de la baignoire
Ou marine ou lacustre au bas-côté fumante
Sur l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes
Ne reste que pénombre entachée de soleil
Et des rubans tissus d'atomes sans sommeil.`,
`Dans une brosserie haut touffue de poils verts
Aux manches de bois pourpre entourés de miroirs
Qu'un corps radieux pénètre issu de la baignoire
Ou marine ou lacustre au bas-côté fumante
Il n'en reste tissu de mouches sans sommeil
Sur l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes
Qu'un peignoir de pénombre entachée de soleil.`,
`Par cette brosserie haut touffue de poils verts
Aux manches de bois pourpre entourés de miroirs
Qu'un corps radieux pénètre issu de la baignoire
Ou marine ou lacustre au bas-côté fumante
Rien n'en reste au rapport de mouches sans sommeil
Sur l'épaisseur au sol élastique et vermeille
Des épingles à cheveux odoriférantes
Secouées là par tant de cimes négligentes
Qu'un peignoir de pénombre entachée de soleil.`
];

const stage = document.getElementById('stage');
const badge = document.getElementById('badge');
const pausedEl = document.getElementById('paused');

const FONT_SIZE = 22;
const FONT = `${FONT_SIZE}px 'Special Elite', 'Courier New', monospace`;

/* réglages : lenteur et douceur */
const SPRING = 0.018;
const DAMPING = 0.93;
const WIND_R = 170;
const WIND_G = 0.06;
const SCATTER_MIN = 2.5;
const SCATTER_MAX = 6;

let letters = [];
let current = -1;
let frozen = false;
let W = innerWidth, H = innerHeight;

const mouse = { x: W / 2, y: H / 2, vx: 0, vy: 0, speed: 0 };

/* ---------- audio : machine à écrire synthétisée, légère ---------- */
let AC = null, master = null, noiseBuf = null;
let clackTimes = [];

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain();
  master.gain.value = 0.16;
  master.connect(AC.destination);
  const len = AC.sampleRate * 0.1;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}

function keyClack(vol) {
  if (!AC) return;
  const t = AC.currentTime;
  const v = Math.min(vol, 0.25);

  const src = AC.createBufferSource();
  src.buffer = noiseBuf;
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 3200 + Math.random() * 2200;
  bp.Q.value = 2.5;
  const g = AC.createGain();
  g.gain.setValueAtTime(v, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.035);

  const o = AC.createOscillator();
  o.type = 'sine';
  o.frequency.setValueAtTime(180 + Math.random() * 50, t);
  o.frequency.exponentialRampToValueAtTime(80, t + 0.025);
  const g2 = AC.createGain();
  g2.gain.setValueAtTime(v * 0.35, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.035);
  o.connect(g2); g2.connect(master);
  o.start(t); o.stop(t + 0.04);
}

function ding() {
  if (!AC) return;
  const t = AC.currentTime;
  [1244, 1867, 2489].forEach((f, i) => {
    const o = AC.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = AC.createGain();
    g.gain.setValueAtTime([0.08, 0.035, 0.018][i], t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.2 - i * 0.25);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + 1.3);
  });
}

function carriage() {
  if (!AC) return;
  const t = AC.currentTime;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const bp = AC.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.setValueAtTime(500, t);
  bp.frequency.exponentialRampToValueAtTime(1800, t + 0.3);
  bp.Q.value = 3;
  const g = AC.createGain();
  g.gain.setValueAtTime(0.05, t);
  g.gain.setValueAtTime(0.05, t + 0.22);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t); src.stop(t + 0.36);
}

function clackBudget() {
  const now = performance.now();
  clackTimes = clackTimes.filter(x => now - x < 140);
  if (clackTimes.length >= 2) return false;
  clackTimes.push(now);
  return true;
}

/* ---------- mise en page ---------- */
const meas = document.createElement('canvas').getContext('2d');

/* largeur de repli par caractère (police non chargée / canvas indisponible) */
const FALLBACK_W = FONT_SIZE * 0.62;
function charWidth(ch) {
  const w = meas.measureText(ch).width;
  return w > 0 ? w : (ch === ' ' ? FALLBACK_W * 0.66 : FALLBACK_W);
}
function lineWidth(s) {
  let t = 0;
  for (const ch of s) t += charWidth(ch);
  return t;
}

function layout(text) {
  const maxWidth = Math.min(W * 0.82, 900);
  const lines = [];
  for (const raw of text.split('\n')) {
    const words = raw.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (lineWidth(test) > maxWidth && line) {
        lines.push(line);
        line = w;
      } else line = test;
    }
    lines.push(line);
  }
  const lh = FONT_SIZE * 1.55;
  const totalH = lines.length * lh;
  const top = Math.max(H * 0.16, (H - totalH) / 2);
  const placed = [];
  lines.forEach((line, li) => {
    const lw = lineWidth(line);
    let x = (W - lw) / 2;
    const y = top + li * lh;
    for (const ch of line) {
      placed.push({ ch, x, y });
      x += charWidth(ch);
    }
  });
  return placed;
}

function makeLetter(ch, x, y) {
  const el = document.createElement('span');
  el.className = 'letter';
  el.textContent = ch;
  el.style.fontSize = FONT_SIZE + 'px';
  stage.appendChild(el);
  return {
    ch, el,
    hx: x, hy: y,
    px: x + (Math.random() - 0.5) * 60,
    py: y + (Math.random() - 0.5) * 60,
    vx: 0, vy: 0,
    appear: 0, lastClack: 0
  };
}

function buildTargets(text) {
  const placed = layout(text);
  const old = letters;
  letters = [];
  const n = Math.min(old.length, placed.length);
  for (let i = 0; i < n; i++) {
    const l = old[i];
    l.ch = placed[i].ch;
    l.el.textContent = l.ch;
    l.hx = placed[i].x; l.hy = placed[i].y;
    letters.push(l);
  }
  for (let i = n; i < placed.length; i++) {
    const seed = old.length ? old[(i * 7) % old.length] : null;
    const l = makeLetter(placed[i].ch, placed[i].x, placed[i].y);
    if (seed) { l.px = seed.px; l.py = seed.py; }
    letters.push(l);
  }
  for (let i = placed.length; i < old.length; i++) old[i].el.remove();
}

function showText(idx, typedIntro) {
  current = idx;
  buildTargets(TEXTES[idx]);
  badge.textContent = `variante ${idx + 1} / ${TEXTES.length}`;
  const now = performance.now();
  letters.forEach((l, i) => {
    l.appear = typedIntro ? now + 120 + i * 26 : now;
    if (typedIntro) { l.px = l.hx; l.py = l.hy; l.vx = 0; l.vy = 0; }
  });
}

/* ---------- interactions ---------- */
function wake() { initAudio(); if (AC.state === 'suspended') AC.resume(); }

addEventListener('mousemove', e => {
  wake();
  const nx = e.clientX, ny = e.clientY;
  mouse.vx = nx - mouse.x;
  mouse.vy = ny - mouse.y;
  mouse.x = nx; mouse.y = ny;
  mouse.speed = Math.hypot(mouse.vx, mouse.vy);
});

addEventListener('click', () => {
  wake();
  if (frozen) toggleFreeze();
  ding();
  carriage();
  let next;
  do { next = Math.floor(Math.random() * TEXTES.length); } while (next === current);
  letters.forEach(l => {
    const a = Math.random() * Math.PI * 2;
    const p = SCATTER_MIN + Math.random() * (SCATTER_MAX - SCATTER_MIN);
    l.vx += Math.cos(a) * p;
    l.vy += Math.sin(a) * p;
  });
  setTimeout(() => showText(next, false), 560);
});

function toggleFreeze() {
  frozen = !frozen;
  pausedEl.classList.toggle('on', frozen);
  if (frozen) letters.forEach(l => { l.vx = 0; l.vy = 0; });
}

addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    wake();
    toggleFreeze();
  }
});

addEventListener('resize', () => {
  W = innerWidth; H = innerHeight;
  if (current >= 0) showText(current, false);
});

/* ---------- boucle physique ---------- */
let last = performance.now();

function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - last) / 16.667, 2.5);
  last = now;

  for (const l of letters) {
    if (now < l.appear) { l.el.style.opacity = '0'; continue; }
    l.el.style.opacity = '1';

    if (!frozen) {
      let fx = (l.hx - l.px) * SPRING;
      let fy = (l.hy - l.py) * SPRING;

      const dx = l.px - mouse.x, dy = l.py - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (mouse.speed > 0.3 && d2 < WIND_R * WIND_R) {
        const fall = 1 - Math.sqrt(d2) / WIND_R;
        const g = fall * fall * mouse.speed * WIND_G;
        fx += mouse.vx * g + (dx / (Math.sqrt(d2) + 1)) * fall * 0.12;
        fy += mouse.vy * g + (dy / (Math.sqrt(d2) + 1)) * fall * 0.12;
      }

      l.vx += fx * dt;
      l.vy += fy * dt;
      l.vx *= Math.pow(DAMPING, dt);
      l.vy *= Math.pow(DAMPING, dt);

      const speed = Math.hypot(l.vx, l.vy);
      if (speed > 2 && now - l.lastClack > 300 && clackBudget()) {
        l.lastClack = now;
        keyClack(Math.min(speed / 20, 0.2));
      }

      l.px += l.vx * dt;
      l.py += l.vy * dt;
    }

    l.el.style.transform = `translate(${l.px}px, ${l.py}px) rotate(${frozen ? 0 : l.vx * 0.5}deg)`;
  }

  mouse.vx *= 0.7;
  mouse.vy *= 0.7;
  mouse.speed *= 0.7;
}

let started = false;
function start() {
  if (started) return;
  started = true;
  meas.font = FONT;
  showText(Math.floor(Math.random() * TEXTES.length), true);
  requestAnimationFrame(tick);
}

if (document.fonts && document.fonts.ready) {
  Promise.race([
    document.fonts.load(FONT).catch(() => {}),
    new Promise(r => setTimeout(r, 2500))
  ]).then(() => document.fonts.ready).then(start, start);
} else start();
</script>
</body>
</html>
